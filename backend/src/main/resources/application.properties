spring.application.name=backend

# Carrega as variáveis locais de backend/.env (opcional).
# Em produção/deploy, defina as variáveis de ambiente no provedor.
spring.config.import=optional:file:.env[.properties]

# Banco de dados (Supabase/Postgres) - valores vindos do ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# CORS (usado pelo SecurityConfig)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}

# JWT (tipo de retorno do login)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000